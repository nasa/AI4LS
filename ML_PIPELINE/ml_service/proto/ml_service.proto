// proto/ml_service.proto
syntax = "proto3";

package mlservice;

service MLService {
  // Train a machine learning model with streaming progress
  rpc TrainModel(TrainRequest) returns (stream TrainingProgress);
  
  // Get information about a trained model
  rpc GetModelInfo(ModelInfoRequest) returns (ModelInfo);
  
  // Make predictions with a trained model
  rpc Predict(PredictRequest) returns (PredictResponse);
  
  // List all trained models
  rpc ListModels(ListModelsRequest) returns (ModelList);

  // Train an ensemble of models 
  rpc TrainEnsemble(EnsembleRequest) returns (EnsembleResponse);
}

message TrainRequest {
  string dataset_id = 1;
  string algorithm = 2;  // "random_forest", "svm", "logistic_regression", etc.
  map<string, string> hyperparameters = 3;
  string target_column = 4;
  repeated string feature_columns = 5;  // If empty, use all columns except target
  float test_size = 6;  // Train/test split ratio (default: 0.2)
  int32 random_state = 7;
  string task_type = 8;  // "classification" or "regression"
}

message TrainingProgress {
  string model_id = 1;
  string status = 2;  // "starting", "training", "evaluating", "completed", "failed"
  string message = 3;
  int32 progress_percent = 4;
  
  // Training metrics (populated during training)
  map<string, double> training_metrics = 5;
  
  // Final results (populated when completed)
  ModelInfo model_info = 6;
  map<string, double> test_metrics = 7;
  
  // Error details (if failed)
  string error_message = 8;
}

message ModelInfo {
  string model_id = 1;
  string algorithm = 2;
  string task_type = 3;
  string dataset_id = 4;
  string target_column = 5;
  repeated string feature_columns = 6;
  int32 num_samples = 7;
  int32 num_features = 8;
  map<string, string> hyperparameters = 9;
  string created_at = 10;
  map<string, double> training_metrics = 11;
  map<string, double> test_metrics = 12;
}

message ModelInfoRequest {
  string model_id = 1;
}

message PredictRequest {
  string model_id = 1;
  bytes input_data = 2;  // CSV or JSON format
  string format = 3;  // "csv" or "json"
}

message PredictResponse {
  bool success = 1;
  repeated double predictions = 2;
  repeated double probabilities = 3;  // For classification (if available)
  string error_message = 4;
}

message ListModelsRequest {
  string algorithm = 1;  // Filter by algorithm (optional)
  string task_type = 2;  // Filter by task type (optional)
  int32 limit = 3;  // Max number of models to return
}

message ModelList {
  repeated ModelInfo models = 1;
  int32 total_count = 2;
}

// Request to train ensemble of models
message EnsembleRequest {
    string dataset_id = 1;
    string target_column = 2;
    repeated string algorithms = 3;  // e.g., ["random_forest", "xgboost", "svm"]
}

// Individual model result
message ModelResult {
    string model_id = 1;
    string algorithm = 2;
    double accuracy = 3;
    double precision = 4;
    double recall = 5;
    double f1_score = 6;
}

// Response from ensemble training
message EnsembleResponse {
    bool success = 1;
    repeated ModelResult models = 2;
    int32 num_models = 3;
    string error_message = 4;
}

