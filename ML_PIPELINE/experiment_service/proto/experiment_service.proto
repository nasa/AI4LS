// experiment_service/proto/experiment_service.proto
syntax = "proto3";

package experiment;

// Experiment tracks an entire ML pipeline run
message Experiment {
    string experiment_id = 1;
    string name = 2;
    string description = 3;
    int64 created_at = 4;  // Unix timestamp
    int64 updated_at = 5;
    
    // Pipeline components
    string dataset_id = 6;
    string model_id = 7;
    string feature_importance_id = 8;
    string kegg_analysis_id = 9;
    
    // Metadata
    map<string, string> metadata = 10;
    string status = 11;  // "running", "completed", "failed"
    
    // Results summary
    ExperimentResults results = 12;
}

message ExperimentResults {
    // Dataset info
    int32 num_samples = 1;
    int32 num_features = 2;
    
    // Model info
    string algorithm = 3;
    double model_accuracy = 4;
    double model_f1_score = 5;
    
    // Feature importance
    int32 num_important_features = 6;
    repeated string top_features = 7;
    
    // KEGG enrichment
    int32 num_enriched_pathways = 8;
    repeated string top_pathways = 9;
}

// Request to create a new experiment
message CreateExperimentRequest {
    string name = 1;
    string description = 2;
    map<string, string> metadata = 3;
}

message CreateExperimentResponse {
    bool success = 1;
    string experiment_id = 2;
    string error_message = 3;
}

// Update experiment with pipeline component IDs
message UpdateExperimentRequest {
    string experiment_id = 1;
    string dataset_id = 2;
    string model_id = 3;
    string feature_importance_id = 4;
    string kegg_analysis_id = 5;
    string status = 6;
}

message UpdateExperimentResponse {
    bool success = 1;
    string error_message = 2;
}

// Get experiment by ID
message GetExperimentRequest {
    string experiment_id = 1;
}

message GetExperimentResponse {
    bool success = 1;
    Experiment experiment = 2;
    string error_message = 3;
}

// List all experiments
message ListExperimentsRequest {
    int32 limit = 1;
    int32 offset = 2;
    string filter_status = 3;  // Optional filter by status
}

message ListExperimentsResponse {
    bool success = 1;
    repeated Experiment experiments = 2;
    int32 total_count = 3;
    string error_message = 4;
}

// Delete experiment
message DeleteExperimentRequest {
    string experiment_id = 1;
}

message DeleteExperimentResponse {
    bool success = 1;
    string error_message = 2;
}

service ExperimentService {
    rpc CreateExperiment(CreateExperimentRequest) returns (CreateExperimentResponse);
    rpc UpdateExperiment(UpdateExperimentRequest) returns (UpdateExperimentResponse);
    rpc GetExperiment(GetExperimentRequest) returns (GetExperimentResponse);
    rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsResponse);
    rpc DeleteExperiment(DeleteExperimentRequest) returns (DeleteExperimentResponse);
}
