// feature_importance_service/proto/feature_importance_service.proto
syntax = "proto3";

package featureimportance;

service FeatureImportanceService {
  // Compute feature importance for a trained model
  rpc ComputeImportance(ImportanceRequest) returns (ImportanceResponse);
  
  // Get previously computed importance results
  rpc GetImportance(GetImportanceRequest) returns (ImportanceResponse);
}

message ImportanceRequest {
  string model_id = 1;
  string dataset_id = 2;
  repeated string methods = 3;  // ["recursive", "permutation", "built_in"]
  map<string, string> params = 4;  // Method-specific parameters
}

message ImportanceResponse {
  bool success = 1;
  string model_id = 2;
  map<string, FeatureImportances> importances = 3;  // method -> importance scores
  string error_message = 4;
}

message FeatureImportances {
  repeated FeatureScore scores = 1;
  map<string, string> metadata = 2;  // e.g., execution_time, n_features_selected
}

message FeatureScore {
  string feature_name = 1;
  double importance = 2;
  int32 rank = 3;
}

message GetImportanceRequest {
  string model_id = 1;
}
