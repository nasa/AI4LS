// proto/data_service.proto
syntax = "proto3";

package dataservice;

service DataService {
  // Validate dataset structure and quality
  rpc ValidateDataset(ValidateRequest) returns (ValidationResult);
  
  // Apply transformations to dataset
  rpc ApplyTransformation(TransformRequest) returns (TransformationResult);
  
  // Stream large datasets in chunks
  rpc StreamDataset(StreamRequest) returns (stream DataChunk);
  
  // Get dataset metadata
  rpc GetDatasetInfo(DatasetInfoRequest) returns (DatasetInfo);
}

message ValidateRequest {
  string dataset_id = 1;
  bytes dataset_content = 2; // Raw CSV/JSON data
  string format = 3; // "csv", "json", "parquet"
}

message ValidationResult {
  bool is_valid = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
  DatasetInfo info = 4;
}

message DatasetInfo {
  string dataset_id = 1;
  int32 num_rows = 2;
  int32 num_columns = 3;
  repeated ColumnInfo columns = 4;
  int64 size_bytes = 5;
}

message ColumnInfo {
  string name = 1;
  string dtype = 2; // "numeric", "categorical", "datetime", "text"
  int32 null_count = 3;
  repeated string sample_values = 4;
}

message TransformRequest {
  string dataset_id = 1;
  repeated Transformation transformations = 2;
}

message Transformation {
  string type = 1; // "log", "standardize", "normalize", "one_hot_encode"
  repeated string columns = 2; // Columns to apply transformation to
  map<string, string> params = 3; // Additional parameters
}

message TransformationResult {
  string transformed_dataset_id = 1;
  bool success = 2;
  string error_message = 3;
  DatasetInfo transformed_info = 4;
}

message StreamRequest {
  string dataset_id = 1;
  int32 chunk_size = 2; // Number of rows per chunk
}

message DataChunk {
  int32 chunk_number = 1;
  bytes data = 2; // Serialized chunk (CSV/JSON)
  bool is_final = 3;
}

message DatasetInfoRequest {
  string dataset_id = 1;
}
