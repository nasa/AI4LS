// data_service/proto/data_service.proto

syntax = "proto3";

package data;

// Column information
message ColumnInfo {
    string name = 1;
    string dtype = 2;
    int32 null_count = 3;
    repeated string sample_values = 4;
}

// Dataset information
message DatasetInfo {
    string dataset_id = 1;
    int32 num_rows = 2;
    int32 num_columns = 3;
    repeated string column_names = 4;
    repeated string sample_names = 5;
    int64 size_bytes = 6;
    repeated ColumnInfo columns = 7;  // For backward compatibility with orchestration
}

// Validation request
message ValidationRequest {
    string osd_id = 1;
    repeated string patterns = 2;
    string factor_name = 3;
    repeated string factor_values = 4;
}

// Download request
message DownloadRequest {
    string osd_id = 1;
    repeated string patterns = 2;
    string factor_name = 3;
    repeated string factor_values = 4;
    repeated string exclude_columns = 5;
    double cv_step = 6;  // DEPRECATED - use TransformDataset instead
    int32 min_features = 7;  // DEPRECATED - use TransformDataset instead
    string dataset_id = 8;
}

// Upload request (legacy - for backward compatibility)
message UploadRequest {
    string dataset_id = 1;
    bytes file_content = 2;
    string format = 3;
    repeated string exclude_columns = 4;
    double cv_step = 5;
}

// Validation result
message ValidationResult {
    bool is_valid = 1;
    string dataset_id = 2;
    repeated string errors = 3;
    repeated string warnings = 4;
    DatasetInfo dataset_info = 5;
}

// Request to transform a dataset
message TransformRequest {
    string dataset_id = 1;
    repeated string transformations = 2;  // e.g., ["log", "standardize", "transpose"]
    double cv_step = 3;  // Coefficient of variation filtering step
    int32 min_features = 4;  // Minimum features to keep
}

// Transform response
message TransformResponse {
    bool success = 1;
    string transformed_dataset_id = 2;
    string error_message = 3;
    DatasetInfo dataset_info = 4;
}

// Apply transformation request (legacy)
message ApplyTransformationRequest {
    string dataset_id = 1;
    repeated Transformation transformations = 2;
}

message Transformation {
    string type = 1;
    repeated string columns = 2;
    map<string, string> parameters = 3;  // Match orchestration service
}

message TransformationResult {
    bool success = 1;
    string transformed_dataset_id = 2;
    string error_message = 3;
    DatasetInfo transformed_info = 4;
}

// Request to get dataset
message GetDatasetRequest {
    string dataset_id = 1;
    int32 chunk_size = 2;
}

// Stream dataset request (alias for GetDataset)
message StreamDatasetRequest {
    string dataset_id = 1;
    int32 chunk_size = 2;
}

// Data chunk for streaming
message DataChunk {
    bytes data = 1;
    int32 chunk_number = 2;
    bool is_final = 3;
}

// Get dataset info request
message GetDatasetInfoRequest {
    string dataset_id = 1;
}

// Health check
message HealthCheckRequest {}

message HealthCheckResponse {
    bool healthy = 1;
    string version = 2;
}


message FilterRequest {
    string dataset_id = 1;
    double cv_step = 2;
    int32 min_features = 3;
}

message FilterResponse {
    bool success = 1;
    string filtered_dataset_id = 2;
    DatasetInfo dataset_info = 3;
    string error_message = 4;
}



service DataService {
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc ValidateDataset(ValidationRequest) returns (ValidationResult);
    rpc DownloadDataset(DownloadRequest) returns (ValidationResult);
    rpc UploadDataset(UploadRequest) returns (ValidationResult);
    rpc ApplyTransformation(ApplyTransformationRequest) returns (TransformationResult);
    rpc TransformDataset(TransformRequest) returns (TransformResponse);
    rpc GetDataset(GetDatasetRequest) returns (stream DataChunk);
    rpc StreamDataset(StreamDatasetRequest) returns (stream DataChunk);
    rpc GetDatasetInfo(GetDatasetInfoRequest) returns (DatasetInfo);
    rpc FilterDataset(FilterRequest) returns (FilterResponse);
}

// ============================================================================
// MULTI-DATASET COMBINING SERVICE
// ============================================================================

// Request to get OSD IDs for a tissue
message GetOSDIDsRequest {
    string tissue_name = 1;
}

// Response with OSD IDs for a tissue
message GetOSDIDsResponse {
    bool success = 1;
    repeated string osd_ids = 2;
    string error_message = 3;
}

// Request to download multiple datasets
message DownloadMultipleDatasetsRequest {
    repeated string osd_ids = 1;
    repeated string patterns = 2;
    string factor_name = 3;
    repeated string factor_values = 4;
    repeated string exclude_columns = 5;
    int32 min_features = 6;
    float cv_step = 7;
}

// Response with dataset IDs for each OSD
message DownloadMultipleDatasetsResponse {
    bool success = 1;
    map<string, string> dataset_ids = 2;  // OSD ID -> dataset_id
    map<string, string> sample_counts = 3; // OSD ID -> sample count
    string error_message = 4;
}

// Request to find common genes
message FindCommonGenesRequest {
    repeated string dataset_ids = 1;
}

// Response with common genes
message FindCommonGenesResponse {
    bool success = 1;
    repeated string common_genes = 2;
    int32 count = 3;
    string error_message = 4;
}

// Request to combine datasets
message CombineDatasetsRequest {
    repeated string dataset_ids = 1;
    repeated string common_genes = 2;  // Optional: if empty, will compute
    string output_name = 3;  // Optional name for combined dataset
}

// Response with combined dataset
message CombineDatasetsResponse {
    bool success = 1;
    string combined_dataset_id = 2;
    int32 total_samples = 3;
    int32 total_genes = 4;
    map<string, int32> samples_per_source = 5;  // OSD ID -> sample count in combined
    string condition_column = 6;
    string error_message = 7;
}

// Convenience request: combine by tissue name
message CombineByTissueRequest {
    string tissue_name = 1;
    repeated string patterns = 2;
    string factor_name = 3;
    repeated string factor_values = 4;
    int32 min_features = 5;
    float cv_step = 6;
    string output_name = 7;
}

// Response: same as CombineDatasetsResponse
message CombineByTissueResponse {
    bool success = 1;
    string combined_dataset_id = 2;
    int32 total_samples = 3;
    int32 total_genes = 4;
    map<string, int32> samples_per_source = 5;
    string condition_column = 6;
    string error_message = 7;
}

// Service definition
service MultiDatasetService {
    // Get OSD IDs for a tissue
    rpc GetOSDIDsForTissue(GetOSDIDsRequest) returns (GetOSDIDsResponse);
    
    // Download multiple datasets
    rpc DownloadMultipleDatasets(DownloadMultipleDatasetsRequest) returns (DownloadMultipleDatasetsResponse);
    
    // Find common genes across datasets
    rpc FindCommonGenes(FindCommonGenesRequest) returns (FindCommonGenesResponse);
    
    // Combine datasets
    rpc CombineDatasets(CombineDatasetsRequest) returns (CombineDatasetsResponse);
    
    // Convenience: combine by tissue name in one call
    rpc CombineByTissue(CombineByTissueRequest) returns (CombineByTissueResponse);
}
