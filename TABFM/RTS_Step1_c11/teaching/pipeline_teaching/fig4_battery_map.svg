   <text style="font-style: italic; font-size: 9px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'; fill: #555555" transform="translate(229.671562 649.136812)">What this shows: The full analysis schedule from start to finish. Each bar is one component; bar length is proportional to runtime.</text>
   <text style="font-style: italic; font-size: 9px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'; fill: #555555" transform="translate(227.603672 660.135375)">Blue = main tests, Green = classifier tests, Orange = reruns, Gray = quick checks. The red line marks current progress (in Test 1).</text>
