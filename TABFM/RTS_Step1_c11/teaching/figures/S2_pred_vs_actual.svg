   <text style="font-style: italic; font-size: 6.5px; font-family: 'Liberation Sans'" transform="translate(7.2 411.086719)">Shows: Predicted vs actual for hip BMD (Biomni A10G, 10x5 repeated k-fold CV, 628 features, n=38). Spearman = 0.2072. Predictions compress toward the mean</text>
   <text style="font-style: italic; font-size: 6.5px; font-family: 'Liberation Sans'" transform="translate(181.334492 418.088031)">(predicted SD 0.004 vs actual SD 0.017).</text>
