   <g id="text_11">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(410.405 593.621875)">Standard permutation null is BLIND to B and C:</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(428.841875 602.238875)">it shuffles the target, not the features.</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(431.493125 610.890875)">Noise structure lives in the features.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'; text-anchor: middle" x="500.4" y="17.345625" transform="rotate(-0 500.4 17.345625)">Three Readings of the p=0.007 Result — and the Tests That Separate Them</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font-style: italic; font-size: 7px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'; fill: #555555" transform="translate(46.8 655.298437)">What this shows: The decision tree for the arm-aware test battery. Three readings of the same p=0.007 result, three tests that separate them, three outcomes with stated numeric thresholds. Decision rules are fixed BEFORE running.</text>
   <text style="font-style: italic; font-size: 7px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'; fill: #555555" transform="translate(46.8 662.838312)">What it does not show: Results of the tests — they have not been run yet. This is the spec, not the outcome.</text>
   <text style="font-style: italic; font-size: 7px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'; fill: #555555" transform="translate(46.8 670.378187)">Source: Schematic constructed this task from project artifacts and open-items list.</text>
  </g>
 </g>
