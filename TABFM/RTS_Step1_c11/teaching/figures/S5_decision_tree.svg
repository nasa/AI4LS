   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(418.972656 79.215937)">LOOCV Spearman +0.376, p=0.007</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(427.344531 89.987187)">(1000-shuffle permutation null)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(107.589241 189.600328)">Reading A: Individual Physiology</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(110.191702 198.755891)">The model found real biological</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(101.21889 207.911453)">structure predicting who loses bone.</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(100.526936 217.067016)">Signal is within-arm, not across-arm.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(446.073711 189.600328)">Reading B: Arm Membership</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(431.42582 198.755891)">The model detected arm assignment</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(439.929141 207.911453)">from fitness features and used it</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(439.456992 217.067016)">to predict the arm-graded target.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(781.468298 189.600328)">Reading C: Noise Ranking</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(767.534939 198.755891)">The model found structure in DXA</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(766.118493 207.911453)">measurement noise that correlates</text>
    <text style="font-size: 8.5px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(772.021345 217.067016)">with body composition features.</text>
   </g>
