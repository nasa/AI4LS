   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(124.129554 325.936375)">Test 1: Arm-Stratified Null</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(108.571429 334.553375)">Permute target WITHIN each arm.</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(112.348929 343.170375)">Preserves arm structure, breaks</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(119.227679 351.787375)">individual target-feature link.</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(117.233929 360.404375)">If still significant → not just B.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(455.496875 325.936375)">Test 2: Arm-Adjusted Null</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(441.0525 334.553375)">Rank-transform target within arm,</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(441.858125 343.170375)">then permute. Removes ALL arm</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(463.28 351.787375)">structure from target.</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(455.718125 360.404375)">If still significant → not B.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(787.308571 325.936375)">Test 3: Reading C Check</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(784.867946 334.553375)">Within each arm, correlate</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(783.309821 343.170375)">prediction errors with body-</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(791.976696 351.787375)">composition variables.</text>
    <text style="font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(786.869196 360.404375)">If correlated → C is alive.</text>
   </g>
