   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(147.836429 474.818875)">A survives:</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(135.349554 483.435875)">p_stratified &lt; 0.05</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(126.017679 492.052875)">AND p_adjusted &lt; 0.05</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(126.795179 500.669875)">AND C check negative</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(131.615804 509.321875)">→ Proceed to Aim 2</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(478.835 474.801375)">B survives:</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(466.63875 483.418375)">p_stratified ≥ 0.05</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(459.973125 492.035375)">OR p_adjusted ≥ 0.05</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(446.176875 500.652375)">→ Signal is arm-confounded</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(440.761875 509.304375)">→ Arm-aware modeling needed</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(817.321071 474.760125)">C alive:</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(799.982946 483.377125)">C check positive</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(794.407321 491.994125)">(|rho| &gt; 0.4, p &lt; 0.10</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(788.679821 500.728625)">in any arm with n ≥ 10)</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Liberation Sans', 'Arimo', 'DejaVu Sans'" transform="translate(787.982946 509.345625)">→ Signal may be noise</text>
   </g>
